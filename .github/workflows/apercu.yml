# Aperçu en ligne de SkanEcom — les boutiques de démo et la console, sur des
# adresses workers.dev que Skander ouvre depuis n'importe où (docs/APERCU.md).
#
#   https://skanecom-apercu-maymar.<sous-domaine>.workers.dev       Maymar
#   https://skanecom-apercu-selma.<sous-domaine>.workers.dev        Maison Selma
#   https://skanecom-apercu-quincaillerie.<sous-domaine>.workers.dev Quincaillerie du Sud
#   https://skanecom-apercu-console.<sous-domaine>.workers.dev      console et backoffices
#
# Une seule application (skanecom-application) ; devant elle, un petit
# routeur par adresse (outils/apercu/routeur.js). La base est le projet
# Supabase de l'aperçu (org SkanEcom), jamais celui de la production.
#
# La base de l'aperçu suit le code : chaque exécution envoie les migrations
# à la fonction apercu-installer du projet (supabase/functions/, protégée
# par la clé service_role), qui joue les nouvelles une fois chacune, le jeu
# de démo la première fois, et les crochets des codes de connexion
# (supabase/apercu/codes-demo.sql). Aucun mot de passe de base à copier.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   — déjà là (29/09)
#   APERCU_SUPABASE_SERVICE_ROLE_KEY              — la clé service_role (legacy) du projet de l'aperçu
#   SUPABASE_ACCESS_TOKEN                         — jeton d'accès Supabase (compte de Skander) : les
#                                                   réglages de l'authentification (crochets des codes,
#                                                   téléphone, adresses) et l'invitation de l'administrateur
# Le projet (skanecom-apercu, org SkanEcom, eu-west-3) et sa clé publique
# sont écrits ci-dessous : publics par nature, ils partent dans le navigateur.
# Tant qu'un secret manque, le workflow le dit et s'arrête sans erreur.
name: Aperçu en ligne

on:
  push:
    branches: [main, claude/gallant-hawking-gi9xv0]
    paths:
      - "application/**"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/apercu/**"
      - "supabase/functions/apercu-installer/**"
      - "supabase/fichiers-demo/**"
      - "outils/annuaire.mjs"
      - "outils/apercu/**"
      - ".github/workflows/apercu.yml"
  workflow_dispatch:
    inputs:
      reinviter:
        description: "Renvoyer l'invitation de l'administrateur (lien périmé)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apercu
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APERCU_SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  APERCU_REF: cxvbjwduaisdkvtfjxph
  # L'administrateur de la plateforme sur l'aperçu : invité par e-mail une fois.
  APERCU_ADMIN_EMAIL: skanbenamor12@gmail.com
  NEXT_PUBLIC_SUPABASE_URL: https://cxvbjwduaisdkvtfjxph.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dmJqd2R1YWlzZGt2dGZqeHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzA1OTEsImV4cCI6MjEwNjM0NjU5MX0.tpD2NxLa-RZihUeHTnd6R4jdNT6w1uh3PM-rU02gAMA
  WRANGLER: npx -y wrangler@4
  BUCKET: skanecom-fichiers
  CI: "true"

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tout est-il là ?
        run: |
          manque=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || manque="$manque $v"
          done
          if [ -n "$manque" ]; then
            echo "::notice::Aperçu non déployé : il manque$manque (docs/APERCU.md)."
            echo "Aperçu non déployé : il manque$manque (voir docs/APERCU.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "PRET=0" >> "$GITHUB_ENV"
          else
            echo "PRET=1" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2
        if: env.PRET == '1'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        if: env.PRET == '1'
        with:
          node-version: 22

      - name: La base de l'aperçu (migrations, jeu de démo, crochets des codes)
        if: env.PRET == '1'
        run: |
          . outils/apercu/installe.sh
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f" .sql)
            installe migration "${b#*_}" "$f" "${b%%_*}"
          done
          installe graines seed.sql supabase/seed.sql
          installe script codes-demo.sql supabase/apercu/codes-demo.sql

      - name: Les adresses de l'aperçu
        if: env.PRET == '1'
        run: |
          SOUS=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$SOUS" ] || [ "$SOUS" = "null" ]; then echo "::error::Sous-domaine workers.dev introuvable"; exit 1; fi
          echo "SOUS=$SOUS" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CONSOLE_HOTE=skanecom-apercu-console.$SOUS.workers.dev" >> "$GITHUB_ENV"
          echo "ANNUAIRE_EN_PLUS={\"skanecom-apercu-maymar.$SOUS.workers.dev\":\"maymar\",\"skanecom-apercu-selma.$SOUS.workers.dev\":\"maison-selma\",\"skanecom-apercu-quincaillerie.$SOUS.workers.dev\":\"quincaillerie-demo\"}" >> "$GITHUB_ENV"

      - name: L'authentification (crochets des codes, téléphone, adresses, administrateur)
        if: env.PRET == '1' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          . outils/apercu/installe.sh
          CONSOLE="https://$NEXT_PUBLIC_CONSOLE_HOTE"
          reglage() {  # un objet JSON → PATCH /config/auth
            local code
            code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$APERCU_REF/config/auth" \
              -H "authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" --data-binary @"$1")
            # Le message seul : la réponse entière est la configuration, avec ses secrets.
            if [ "$code" != "200" ]; then echo "::error::Réglages de l'authentification : HTTP $code $(jq -r '.message // .msg // .error // "?"' /tmp/auth.json 2>/dev/null)"; return 1; fi
          }
          # L'administrateur : invité s'il n'a pas encore de compte (ou sur demande).
          code=$(curl -sS -o /tmp/utilisateurs.json -w '%{http_code}' "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/admin/users?per_page=1000" \
            -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$code" != "200" ]; then echo "::error::Comptes illisibles : HTTP $code"; exit 1; fi
          INVITER=0
          if ! jq -e --arg e "$APERCU_ADMIN_EMAIL" '.users | any(.email == $e)' /tmp/utilisateurs.json > /dev/null; then INVITER=1; fi
          if [ "${{ inputs.reinviter }}" = "true" ]; then INVITER=1; fi
          # Les réglages. Le crochet des e-mails attend l'invitation : elle part,
          # elle, par le serveur d'e-mails de Supabase (réservé aux membres de
          # l'organisation — c'est le cas de l'administrateur).
          jq -n --arg site "$CONSOLE" --arg sous "$SOUS" --rawfile invitation supabase/apercu/invitation.html --argjson crochet_email "$([ $INVITER = 1 ] && echo false || echo true)" '{
            site_url: $site,
            uri_allow_list: ("https://*." + $sous + ".workers.dev/**"),
            external_email_enabled: true,
            external_phone_enabled: true,
            sms_provider: "twilio",
            sms_twilio_account_sid: "apercu",
            sms_twilio_auth_token: "apercu",
            sms_twilio_message_service_sid: "apercu",
            sms_otp_length: 6,
            mailer_otp_length: 6,
            mailer_otp_exp: 86400,
            hook_send_sms_enabled: true,
            hook_send_sms_uri: "pg-functions://postgres/private/crochet_sms_apercu",
            hook_send_email_enabled: $crochet_email,
            hook_send_email_uri: "pg-functions://postgres/private/crochet_email_apercu",
            mailer_subjects_invite: "Votre accès à la console SkanEcom",
            mailer_templates_invite_content: $invitation
          }' > /tmp/reglages.json
          reglage /tmp/reglages.json
          echo "Réglages de l'authentification posés (crochet des e-mails : $([ $INVITER = 1 ] && echo 'après l’invitation' || echo actif))."
          if [ $INVITER = 1 ]; then
            jq -n --arg e "$APERCU_ADMIN_EMAIL" '{email: $e}' > /tmp/invitation.json
            code=$(curl -sS -o /tmp/invite.json -w '%{http_code}' -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/invite" \
              -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "content-type: application/json" --data-binary @/tmp/invitation.json)
            if [ "$code" = "200" ]; then echo "Invitation envoyée à $APERCU_ADMIN_EMAIL." | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "::warning::Invitation : HTTP $code $(jq -r '.msg // .message // .error_description // "?"' /tmp/invite.json 2>/dev/null)"; fi
            jq -n '{hook_send_email_enabled: true, hook_send_email_uri: "pg-functions://postgres/private/crochet_email_apercu"}' > /tmp/crochet.json
            reglage /tmp/crochet.json
            echo "Crochet des e-mails actif."
          fi
          # Administrateur de la plateforme (la double authentification se règle
          # à sa première connexion à la console).
          [[ "$APERCU_ADMIN_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]] || { echo "::error::Adresse de l'administrateur illisible"; exit 1; }
          printf "insert into plateforme.administrateurs (user_id, role)\n  select u.id, 'super_admin' from auth.users u where lower(u.email) = lower('%s')\n  on conflict (user_id) do nothing;\n" "$APERCU_ADMIN_EMAIL" > /tmp/administrateur.sql
          installe script administrateur.sql /tmp/administrateur.sql

      - name: Le bucket des photos (R2), public par son adresse r2.dev
        if: env.PRET == '1'
        run: |
          $WRANGLER r2 bucket create "$BUCKET" 2>&1 | tail -2 || true
          $WRANGLER r2 bucket dev-url enable "$BUCKET" -y 2>&1 | tail -2 || true
          URL=$($WRANGLER r2 bucket dev-url get "$BUCKET" 2>&1 | grep -oE 'https://pub-[a-z0-9]+\.r2\.dev' | head -1)
          if [ -z "$URL" ]; then echo "::error::Adresse publique du bucket introuvable"; exit 1; fi
          echo "NEXT_PUBLIC_FICHIERS_URL=$URL" >> "$GITHUB_ENV"

      - name: Les photos de démonstration (seulement quand elles changent)
        if: env.PRET == '1'
        run: |
          VERSION=$(git rev-parse HEAD:supabase/fichiers-demo)
          if curl -fsS "$NEXT_PUBLIC_FICHIERS_URL/apercu/version.txt" 2>/dev/null | grep -qx "$VERSION"; then
            echo "Photos déjà à jour ($VERSION)."
            exit 0
          fi
          cd supabase/fichiers-demo
          find . -type f | sed 's|^\./||' | while read -r f; do
            $WRANGLER r2 object put "$BUCKET/$f" --file "$f" --remote > /dev/null
          done
          echo "$VERSION" > /tmp/version.txt
          $WRANGLER r2 object put "$BUCKET/apercu/version.txt" --file /tmp/version.txt --content-type text/plain --remote > /dev/null
          echo "$(find . -type f | wc -l) photos déposées."

      - name: Compiler l'application
        if: env.PRET == '1'
        working-directory: application
        run: |
          bun install --frozen-lockfile
          node ../outils/annuaire.mjs
          bun run build

      - name: Déployer l'application
        if: env.PRET == '1'
        working-directory: application
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | $WRANGLER secret put SUPABASE_SERVICE_ROLE_KEY --name skanecom-application
          bun run deploy:response-store
          bun run deploy -- --skip-build

      - name: Déployer les routeurs (une adresse par boutique, une pour la console)
        if: env.PRET == '1'
        run: |
          for nom in maymar selma quincaillerie console; do
            d=$(mktemp -d)
            cp outils/apercu/routeur.js "$d/routeur.js"
            cat > "$d/wrangler.jsonc" <<JSON
          {
            "name": "skanecom-apercu-$nom",
            "main": "routeur.js",
            "compatibility_date": "2026-09-28",
            "workers_dev": true,
            "services": [{ "binding": "APPLICATION", "service": "skanecom-application" }]
          }
          JSON
            (cd "$d" && $WRANGLER deploy > /dev/null)
          done

      - name: Les liens
        if: env.PRET == '1'
        run: |
          {
            echo "## Aperçu en ligne"
            echo ""
            echo "| | Adresse |"
            echo "|---|---|"
            echo "| Maymar | https://skanecom-apercu-maymar.$SOUS.workers.dev |"
            echo "| Maison Selma | https://skanecom-apercu-selma.$SOUS.workers.dev |"
            echo "| Quincaillerie du Sud | https://skanecom-apercu-quincaillerie.$SOUS.workers.dev |"
            echo "| Console et backoffices | https://skanecom-apercu-console.$SOUS.workers.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Une adresse workers.dev toute neuve met quelques secondes à répondre :
          # chaque page a une minute pour le faire.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for cible in maymar/ selma/ quincaillerie/ console/connexion; do
            url="https://skanecom-apercu-${cible%%/*}.$SOUS.workers.dev/${cible#*/}"
            code=000
            for _ in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$url : HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          done
