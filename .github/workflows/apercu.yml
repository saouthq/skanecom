# Aperçu en ligne de SkanEcom — les boutiques de démo et la console, sur des
# adresses workers.dev que Skander ouvre depuis n'importe où (docs/APERCU.md).
#
#   https://skanecom-apercu-maymar.<sous-domaine>.workers.dev       Maymar
#   https://skanecom-apercu-selma.<sous-domaine>.workers.dev        Maison Selma
#   https://skanecom-apercu-quincaillerie.<sous-domaine>.workers.dev Quincaillerie du Sud
#   https://skanecom-apercu-console.<sous-domaine>.workers.dev      console et backoffices
#
# Une seule application (skanecom-application) ; devant elle, un petit
# routeur par adresse (outils/apercu/routeur.js). La base est le projet
# Supabase de l'aperçu (org SkanEcom), jamais celui de la production.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   — déjà là (29/09)
#   APERCU_SUPABASE_SERVICE_ROLE_KEY              — la clé service_role du projet de l'aperçu
# Variables (même page, onglet Variables), ou les valeurs par défaut ci-dessous :
#   APERCU_SUPABASE_URL, APERCU_SUPABASE_CLE_PUBLIQUE (publiques par nature)
# Tant qu'il en manque une, le workflow le dit et s'arrête sans erreur.
name: Aperçu en ligne

on:
  push:
    branches: [main, claude/gallant-hawking-gi9xv0]
    paths:
      - "application/**"
      - "supabase/fichiers-demo/**"
      - "outils/annuaire.mjs"
      - "outils/apercu/**"
      - ".github/workflows/apercu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apercu
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APERCU_SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.APERCU_SUPABASE_URL || '' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.APERCU_SUPABASE_CLE_PUBLIQUE || '' }}
  WRANGLER: npx -y wrangler@4
  BUCKET: skanecom-fichiers
  CI: "true"

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tout est-il là ?
        run: |
          manque=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || manque="$manque $v"
          done
          if [ -n "$manque" ]; then
            echo "::notice::Aperçu non déployé : il manque$manque (docs/APERCU.md)."
            echo "Aperçu non déployé : il manque$manque (voir docs/APERCU.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "PRET=0" >> "$GITHUB_ENV"
          else
            echo "PRET=1" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2
        if: env.PRET == '1'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        if: env.PRET == '1'
        with:
          node-version: 22

      - name: Les adresses de l'aperçu
        if: env.PRET == '1'
        run: |
          SOUS=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$SOUS" ] || [ "$SOUS" = "null" ]; then echo "::error::Sous-domaine workers.dev introuvable"; exit 1; fi
          echo "SOUS=$SOUS" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CONSOLE_HOTE=skanecom-apercu-console.$SOUS.workers.dev" >> "$GITHUB_ENV"
          echo "ANNUAIRE_EN_PLUS={\"skanecom-apercu-maymar.$SOUS.workers.dev\":\"maymar\",\"skanecom-apercu-selma.$SOUS.workers.dev\":\"maison-selma\",\"skanecom-apercu-quincaillerie.$SOUS.workers.dev\":\"quincaillerie-demo\"}" >> "$GITHUB_ENV"

      - name: Le bucket des photos (R2), public par son adresse r2.dev
        if: env.PRET == '1'
        run: |
          $WRANGLER r2 bucket create "$BUCKET" 2>&1 | tail -2 || true
          $WRANGLER r2 bucket dev-url enable "$BUCKET" -y 2>&1 | tail -2 || true
          URL=$($WRANGLER r2 bucket dev-url get "$BUCKET" 2>&1 | grep -oE 'https://pub-[a-z0-9]+\.r2\.dev' | head -1)
          if [ -z "$URL" ]; then echo "::error::Adresse publique du bucket introuvable"; exit 1; fi
          echo "NEXT_PUBLIC_FICHIERS_URL=$URL" >> "$GITHUB_ENV"

      - name: Les photos de démonstration (seulement quand elles changent)
        if: env.PRET == '1'
        run: |
          VERSION=$(git rev-parse HEAD:supabase/fichiers-demo)
          if curl -fsS "$NEXT_PUBLIC_FICHIERS_URL/apercu/version.txt" 2>/dev/null | grep -qx "$VERSION"; then
            echo "Photos déjà à jour ($VERSION)."
            exit 0
          fi
          cd supabase/fichiers-demo
          find . -type f | sed 's|^\./||' | while read -r f; do
            $WRANGLER r2 object put "$BUCKET/$f" --file "$f" --remote > /dev/null
          done
          echo "$VERSION" > /tmp/version.txt
          $WRANGLER r2 object put "$BUCKET/apercu/version.txt" --file /tmp/version.txt --content-type text/plain --remote > /dev/null
          echo "$(find . -type f | wc -l) photos déposées."

      - name: Compiler l'application
        if: env.PRET == '1'
        working-directory: application
        run: |
          bun install --frozen-lockfile
          node ../outils/annuaire.mjs
          bun run build

      - name: Déployer l'application
        if: env.PRET == '1'
        working-directory: application
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | $WRANGLER secret put SUPABASE_SERVICE_ROLE_KEY --name skanecom-application
          bun run deploy:response-store
          bun run deploy -- --skip-build

      - name: Déployer les routeurs (une adresse par boutique, une pour la console)
        if: env.PRET == '1'
        run: |
          for nom in maymar selma quincaillerie console; do
            d=$(mktemp -d)
            cp outils/apercu/routeur.js "$d/routeur.js"
            cat > "$d/wrangler.jsonc" <<JSON
          {
            "name": "skanecom-apercu-$nom",
            "main": "routeur.js",
            "compatibility_date": "2026-09-28",
            "workers_dev": true,
            "services": [{ "binding": "APPLICATION", "service": "skanecom-application" }]
          }
          JSON
            (cd "$d" && $WRANGLER deploy > /dev/null)
          done

      - name: Les liens
        if: env.PRET == '1'
        run: |
          {
            echo "## Aperçu en ligne"
            echo ""
            echo "| | Adresse |"
            echo "|---|---|"
            echo "| Maymar | https://skanecom-apercu-maymar.$SOUS.workers.dev |"
            echo "| Maison Selma | https://skanecom-apercu-selma.$SOUS.workers.dev |"
            echo "| Quincaillerie du Sud | https://skanecom-apercu-quincaillerie.$SOUS.workers.dev |"
            echo "| Console et backoffices | https://skanecom-apercu-console.$SOUS.workers.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
          for h in maymar selma quincaillerie console; do
            curl -s -o /dev/null -w "skanecom-apercu-$h : HTTP %{http_code}\n" "https://skanecom-apercu-$h.$SOUS.workers.dev/" || true
          done
