# Vitrine SkanEcom : vérification des types, compilation pour Cloudflare
# Workers, puis essai de bout en bout — les deux boutiques du jeu de démo,
# servies par la même application, ne se mélangent jamais
# (outils/essai-vitrine.sh).
#
# La chaîne est la même que sur le poste d'un développeur : base locale
# simulée, API locale (PostgREST), application compilée et lancée dans workerd.
name: Vitrine

on:
  push:
    paths:
      - "application/**"
      - "supabase/**"
      - "outils/**"
      - ".github/workflows/vitrine.yml"
  pull_request:
    paths:
      - "application/**"
      - "supabase/**"
      - "outils/**"
      - ".github/workflows/vitrine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitrine:
    name: Types, compilation, essais et parcours
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer Postgres 16 et pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap
          sudo systemctl stop postgresql || true

      - name: Base locale et API locale
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          outils/base-locale.sh reinit
          outils/api-locale.sh demarrer

      - name: Dépendances
        working-directory: application
        run: bun install --frozen-lockfile

      - name: Vérification des types
        working-directory: application
        run: bun run typecheck

      - name: Relecture du code (eslint)
        working-directory: application
        run: bun run lint

      - name: Compilation
        working-directory: application
        run: |
          set -a; . ../.outils/api-locale.env; set +a
          bun run build

      - name: Essai de bout en bout
        working-directory: application
        run: |
          set -a; . ../.outils/api-locale.env; set +a
          # --host : sans lui, le serveur n'écoute que sur « localhost », qui
          # vaut ::1 (IPv6) sur les machines GitHub, et 127.0.0.1 ne répond pas.
          setsid bun run start --port 4200 --host 127.0.0.1 > ../.outils/vitrine.log 2>&1 < /dev/null &
          pret=non
          for _ in $(seq 1 60); do
            curl -s -o /dev/null -H "Host: maymar.localhost" http://127.0.0.1:4200/ && { pret=oui; break; }
            sleep 1
          done
          if [ "$pret" != oui ]; then echo "::error::La vitrine ne répond pas sur 127.0.0.1:4200 après 60 s"; exit 1; fi
          ../outils/essai-vitrine.sh http://127.0.0.1:4200

      # Un testeur à la souris, au clavier et au doigt (essais/parcours-humain.mjs) :
      # focus, défilement, feuille de filtres, tiroir du panier, en-tête partout.
      - name: Parcours humain (souris, clavier, téléphone)
        working-directory: application
        env:
          CAPTURES: ${{ github.workspace }}/.outils/captures
        run: |
          bunx playwright-core install chromium
          bun run parcours

      # La console : connexion, double authentification, création et ouverture
      # d'une boutique, marque avec aperçu, journal, portes fermées.
      - name: Parcours de la console
        working-directory: application
        env:
          CAPTURES: ${{ github.workspace }}/.outils/captures/console
        run: |
          set -a; . ../.outils/api-locale.env; set +a
          bun run parcours:console

      # Une vraie commande dans chaque gabarit : panier, numéro confirmé par
      # code SMS (le relais de l'API locale tient lieu de fournisseur),
      # adresse, frais du gouvernorat, page de fin ; puis sur téléphone.
      - name: Parcours de commande
        working-directory: application
        env:
          CAPTURES: ${{ github.workspace }}/.outils/captures/commande
        run: |
          set -a; . ../.outils/api-locale.env; set +a
          bun run parcours:commande

      # Le backoffice : l'équipe de Maymar confirme, expédie, livre, refuse,
      # annule ; rôles, double authentification du gérant, geste périmé.
      - name: Parcours du backoffice
        working-directory: application
        env:
          CAPTURES: ${{ github.workspace }}/.outils/captures/gestion
        run: |
          set -a; . ../.outils/api-locale.env; set +a
          bun run parcours:gestion

      - name: Aperçu des quatre boutiques
        working-directory: application
        env:
          CAPTURES: ${{ github.workspace }}/.outils/captures/apercu
        run: bun run apercu

      - name: Captures du parcours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-vitrine
          path: .outils/captures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Journal de la vitrine en cas d'échec
        if: failure()
        run: tail -60 .outils/vitrine.log || true
