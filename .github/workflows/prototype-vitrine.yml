# Prototype « vitrine Maymar sur Cloudflare Workers » — phase 2 du prototype
# (docs/cadrage/02-infrastructure.md §8, prototype/vitrine-workers/RAPPORT.md).
#
# Lancement manuel uniquement. Actions :
#   deployer  — déploie le faux Supabase (sain), la vitrine et les faux domaines, puis mesure
#   panne     — redéploie le faux Supabase en panne (503), mesure, attend que la
#               durée de fraîcheur du cache (300 s) soit dépassée, puis mesure encore
#   retablir  — redéploie le faux Supabase sain, puis mesure
#   diagnostic — comme retablir, puis écoute les journaux des Workers pendant quelques requêtes
#   supprimer — supprime les quatre Workers du prototype
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN  — jeton créé avec le modèle « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID — identifiant du compte Cloudflare
name: Prototype vitrine (Cloudflare Workers)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deployer, panne, retablir, diagnostic ou supprimer"
        required: true
        default: deployer
        type: choice
        options: [deployer, panne, retablir, diagnostic, supprimer]

permissions:
  contents: read

concurrency:
  group: prototype-vitrine
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CI: "true"

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID au dépôt."
            exit 1
          fi

      - name: Supprimer les Workers du prototype
        if: inputs.action == 'supprimer'
        run: |
          for w in skanecom-faux-domaines skanecom-prototype-vitrine skanecom-prototype-vitrine-response-store skanecom-faux-supabase; do
            npx -y wrangler@4 delete --name "$w" --force || echo "::warning::$w introuvable ou déjà supprimé"
          done

      - name: Déployer le faux Supabase
        if: inputs.action != 'supprimer'
        working-directory: prototype/faux-supabase
        run: |
          PANNE=0
          if [ "${{ inputs.action }}" = "panne" ]; then PANNE=1; fi
          npx -y wrangler@4 deploy --var "PANNE:$PANNE" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://skanecom-faux-supabase\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::URL du faux Supabase introuvable"; exit 1; fi
          SOUS_DOMAINE=${URL#https://skanecom-faux-supabase.}
          echo "FAUX_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITRINE_URL=https://skanecom-prototype-vitrine.$SOUS_DOMAINE" >> "$GITHUB_ENV"
          echo "FAUX_DOMAINES_URL=https://skanecom-faux-domaines.$SOUS_DOMAINE" >> "$GITHUB_ENV"
          echo "Faux Supabase : $URL (PANNE=$PANNE)"
          curl -s -o /dev/null -w "Contrôle du faux Supabase : HTTP %{http_code}\n" "$URL/rest/v1/categories" || true

      - name: Compiler et déployer la vitrine
        if: inputs.action == 'deployer'
        working-directory: prototype/vitrine-workers
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$FAUX_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="cle-factice-prototype"
          export NEXT_PUBLIC_SITE_URL="$VITRINE_URL"
          bun install --frozen-lockfile
          bun run build:vinext
          bun run deploy:response-store
          bun run deploy:vinext -- --skip-build
          # Les faux domaines se lient à la vitrine : ils se déploient après elle.
          (cd ../faux-domaines && npx -y wrangler@4 deploy)

      - name: Mesurer
        if: inputs.action != 'supprimer'
        working-directory: prototype/vitrine-workers
        run: |
          sleep 15
          echo "Vitrine : $VITRINE_URL"
          bash scripts/mesure.sh "$VITRINE_URL" "Action : ${{ inputs.action }} — mesuré depuis un serveur GitHub (pas depuis la Tunisie)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/test-domaines.sh "$FAUX_DOMAINES_URL" "Action : ${{ inputs.action }} — séparation du cache entre deux domaines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mesurer après expiration de la fraîcheur (panne)
        if: inputs.action == 'panne'
        working-directory: prototype/vitrine-workers
        run: |
          sleep 310
          bash scripts/mesure.sh "$VITRINE_URL" "Action : panne — 5 min plus tard, durée de fraîcheur (300 s) dépassée" | tee -a "$GITHUB_STEP_SUMMARY"
          # Fiche jamais visitée : rien en cache, erreur attendue tant que la page de secours n'existe pas.
          curl -s -o /dev/null -w "Fiche jamais visitée pendant la panne (/produit/valise-rigide-abs-4-roues) : HTTP %{http_code}\n" "$VITRINE_URL/produit/valise-rigide-abs-4-roues" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Écouter les journaux des Workers (diagnostic)
        if: inputs.action == 'diagnostic'
        working-directory: prototype/vitrine-workers
        run: bash scripts/diagnostic.sh "$VITRINE_URL" / /produit/valise-cabine-business

      # Si l'accueil répond 5xx, on écoute les journaux des Workers pendant deux requêtes.
      - name: Diagnostiquer les erreurs 5xx
        if: inputs.action != 'supprimer' && inputs.action != 'diagnostic'
        working-directory: prototype/vitrine-workers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$VITRINE_URL/")
          echo "Accueil : HTTP $code"
          case "$code" in 5*) ;; *) exit 0 ;; esac
          bash scripts/diagnostic.sh "$VITRINE_URL" / /catalogue
