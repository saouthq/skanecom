<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Votre code de connexion</title>
</head>
<!-- Le code de connexion d'un acheteur (réglage compte.verification : par
     e-mail) : six chiffres, à taper sur la page où il les a demandés. Rien
     d'autre — ni lien, ni publicité. Commun à toutes les boutiques.
     À poser dans le projet Supabase de production : Authentication → Emails
     → modèles « Magic link » ET « Confirm signup » (un nouvel acheteur reçoit
     le second), sujet « Votre code de connexion ». Sans lui, Supabase envoie
     un lien au lieu du code. -->
<body style="margin:0;padding:0;background:#f4f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1c1b19;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f3f0;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e6e3dc;border-radius:12px;">
          <tr>
            <td style="padding:32px 32px 8px;">
              <p style="margin:0 0 8px;font-size:15px;line-height:1.5;color:#5f5b53;">Bonjour,</p>
              <p style="margin:0;font-size:15px;line-height:1.5;">Voici votre code pour vous connecter et suivre vos commandes :</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px;">
              <div style="display:inline-block;padding:14px 22px;border-radius:10px;background:#f4f3f0;font-size:32px;font-weight:600;letter-spacing:8px;font-variant-numeric:tabular-nums;color:#1c1b19;">{{ .Token }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;">
              <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#5f5b53;">Tapez ces six chiffres sur la page où vous l'avez demandé. Le code ne sert qu'une fois.</p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#8a857b;">Vous n'avez rien demandé ? Ignorez ce message : sans le code, personne ne peut se connecter à votre place.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
